        // 클립보드 복사 함수 (iframe 환경 호환)
        function copyText(text, label) {
            const tempInput = document.createElement('textarea');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                showToast(`${label} (${text}) 복사 완료!`);
            } catch (err) {
                showToast(`복사 실패: 직접 선택해 주세요.`);
            }
            document.body.removeChild(tempInput);
        }

        // 토스트 메시지 표시
        let toastTimer = null;
        function showToast(msg) {
            const box = document.getElementById('toast-box');
            const textEl = document.getElementById('toast-message');
            textEl.textContent = msg;
            box.classList.remove('hidden');
            box.classList.add('flex');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.add('hidden');
                box.classList.remove('flex');
            }, 2600);
        }

        // .env 파일에서 password 및 file_password 값 로드 (HTTP 서버 및 로컬 file:// 환경 모두 호환)
        let currentDocForDownload = null;
        let cachedEnvValues = null;

        async function loadEnvValues() {
            if (cachedEnvValues !== null) return cachedEnvValues;
            const defaults = {
                file_password: "",
                password: "",
                info: {}
            };
            try {
                const res = await fetch('.env', { cache: 'no-store' });
                if (res.ok) {
                    const text = await res.text();
                    // .env는 중괄호 없는 JSON 본문 형식 ("key": value, ...)
                    try {
                        const parsed = JSON.parse('{' + text.replace(/^﻿/, '') + '}');
                        if (typeof parsed.file_password === 'string') defaults.file_password = parsed.file_password.trim();
                        if (typeof parsed.password === 'string') defaults.password = parsed.password.trim();
                        if (parsed.info && typeof parsed.info === 'object') defaults.info = parsed.info;
                        cachedEnvValues = defaults;
                        return cachedEnvValues;
                    } catch (parseErr) {
                        // JSON 형식이 아니면 아래 정규식으로 암호만 추출
                    }
                    const fileMatch = text.match(/(?:^|[,\r\n\s])["']?file_password["']?\s*[:=]\s*(?:"([^"]*)"|'([^']*)'|([^,\r\n\s]+))/i);
                    const pageMatch = text.match(/(?:^|[,\r\n\s])["']?password["']?\s*[:=]\s*(?:"([^"]*)"|'([^']*)'|([^,\r\n\s]+))/i);
                    if (fileMatch) {
                        defaults.file_password = (fileMatch[1] ?? fileMatch[2] ?? fileMatch[3] ?? "").trim();
                    }
                    if (pageMatch) {
                        defaults.password = (pageMatch[1] ?? pageMatch[2] ?? pageMatch[3] ?? "").trim();
                    }
                }
            } catch (err) {
                // file:// 환경 등에서 fetch 실패 시 빈 값 유지 (민감 정보는 소스에 두지 않음)
            }
            cachedEnvValues = defaults;
            return cachedEnvValues;
        }

        // .env의 info 값을 프로필 데이터와 화면의 정적 영역(제목·인증 게이트·푸터)에 반영
        async function applyEnvProfile() {
            const info = (await loadEnvValues()).info || {};
            const str = v => (typeof v === 'string' ? v.trim() : '');
            const name = str(info.name);
            const nameEn = str(info.name_en);
            const p = portfolioData.profile;
            p.name = name && nameEn ? `${name} (${nameEn})` : (name || nameEn);
            p.nameEn = nameEn;
            p.email = str(info.email);
            p.phone = str(info.phone);
            p.location = str(info.address);

            if (p.name) document.title = `${p.name} — 에디토리얼 미니멀 포트폴리오`;
            document.querySelectorAll('[data-env-name-en-upper]').forEach(el => { el.textContent = nameEn.toUpperCase(); });
            document.querySelectorAll('[data-env-full-name]').forEach(el => { el.textContent = p.name; });
        }

        async function loadFilePasswordFromEnv() {
            const env = await loadEnvValues();
            return env.file_password;
        }

        async function loadPagePasswordFromEnv() {
            const env = await loadEnvValues();
            return env.password;
        }

        // 최초 페이지 열람 암호 확인
        async function confirmPagePassword() {
            const pwdInput = document.getElementById('page-password-input');
            const pwdError = document.getElementById('page-password-error');
            const expectedPassword = await loadPagePasswordFromEnv();

            // .env를 불러오지 못해 기대 암호가 비어 있으면 항상 거부
            if (!expectedPassword || pwdInput.value.trim() !== expectedPassword) {
                pwdError.textContent = expectedPassword
                    ? '암호가 올바르지 않습니다.'
                    : '.env 설정을 불러오지 못했습니다. 웹 서버(http://)로 열어주세요.';
                pwdError.classList.remove('hidden');
                pwdInput.focus();
                return;
            }

            pwdError.classList.add('hidden');
            const gate = document.getElementById('page-auth-gate');
            gate.classList.add('hidden');
            gate.classList.remove('flex');

            const viewport = document.getElementById('template-viewport');
            const footer = document.getElementById('page-footer');
            viewport.classList.remove('hidden');
            if (footer) footer.classList.remove('hidden');
            await applyEnvProfile();
            renderCurrentTemplate();
        }

        // 첨부 문서 암호 입력 모달 열기
        function openDocModal(docId) {
            const doc = portfolioData.documents.find(d => d.id === docId);
            if (!doc) return;
            currentDocForDownload = doc;
            document.getElementById('modal-doc-title').textContent = doc.title;
            document.getElementById('modal-doc-meta').textContent = `${doc.filename} · ${doc.format}`;

            const pwdInput = document.getElementById('doc-password-input');
            const pwdError = document.getElementById('doc-password-error');
            pwdInput.value = '';
            pwdError.classList.add('hidden');

            const modal = document.getElementById('doc-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => pwdInput.focus(), 50);
        }

        function closeDocModal() {
            const modal = document.getElementById('doc-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            currentDocForDownload = null;
        }

        // 암호 확인 후 실제 문서 파일 다운로드
        async function confirmDocDownload() {
            if (!currentDocForDownload) return;
            const pwdInput = document.getElementById('doc-password-input');
            const pwdError = document.getElementById('doc-password-error');
            const expectedPassword = await loadFilePasswordFromEnv();

            // .env를 불러오지 못해 기대 암호가 비어 있으면 항상 거부
            if (!expectedPassword || pwdInput.value.trim() !== expectedPassword) {
                pwdError.textContent = expectedPassword
                    ? '암호가 올바르지 않습니다.'
                    : '.env 설정을 불러오지 못했습니다. 웹 서버(http://)로 열어주세요.';
                pwdError.classList.remove('hidden');
                pwdInput.focus();
                return;
            }

            pwdError.classList.add('hidden');
            const doc = currentDocForDownload;
            const a = document.createElement('a');
            a.href = doc.filePath;
            a.download = doc.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            closeDocModal();
            showToast(`'${doc.title}' 다운로드가 시작되었습니다.`);
        }

        // [필수 구조 1] 메인 화면 공통 생성기: 좌측 프로필 사진 + 우측 이름/이메일/연락처/소셜 링크
        function renderHeroSection(styleVariant) {
            const p = portfolioData.profile;

            // 템플릿별 카드 스타일 차별화 (모두 좌측 사진 / 우측 기본정보 필수 구조 엄수)
            const containerStyles = {
                'A': 'bg-white border border-brand-sub rounded-3xl p-6 sm:p-10 shadow-sm',
                'B': 'bg-brand-dark text-white border border-brand-main/40 rounded-3xl p-6 sm:p-10 shadow-xl relative overflow-hidden',
                'C': 'bg-white border-2 border-brand-dark rounded-2xl p-6 sm:p-10 shadow-[6px_6px_0px_#384959]'
            }[styleVariant];

            const isDark = styleVariant === 'B';
            const subTextColor = isDark ? 'text-brand-sub' : 'text-brand-main';
            const titleColor = isDark ? 'text-white' : 'text-brand-dark';
            const infoBoxClass = isDark
                ? 'bg-white/5 border border-white/15 text-white hover:border-brand-sub'
                : 'bg-brand-light border border-brand-sub/80 text-brand-dark hover:border-brand-accent';

            return `
                <section id="section-hero" class="${containerStyles}">
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
                        <!-- [필수 좌측 영역] 프로필 사진 -->
                        <div class="md:col-span-4 flex flex-col items-center">
                            <div class="relative group">
                                <div class="w-44 h-44 sm:w-52 sm:h-52 rounded-2xl overflow-hidden border-4 ${isDark ? 'border-brand-sub' : 'border-brand-main'} shadow-lg bg-brand-dark">
                                    <img
                                        src="${p.avatar}"
                                        alt="${p.name} 프로필 사진"
                                        onerror="this.onerror=null; this.src='${p.fallbackAvatar}';"
                                        class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                                    />
                                </div>
                            </div>
                        </div>

                        <!-- [필수 우측 영역] 이름, 직무, 이메일, 연락처, 주소 등 기본 정보 -->
                        <div class="md:col-span-8 space-y-5 text-center md:text-left">
                            <div class="space-y-2">
                                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-sub text-brand-dark text-xs font-bold tracking-wide uppercase">
                                    <i data-lucide="terminal" class="w-3.5 h-3.5 text-brand-accent"></i>
                                    <span>${p.engTitle}</span>
                                </div>
                                <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight ${titleColor}">${p.name}</h1>
                                <p class="text-sm sm:text-base ${subTextColor} leading-relaxed max-w-2xl">${p.tagline}</p>
                            </div>

                            <!-- 이메일 · 연락처 · 위치 그리드 (클릭 시 복사 지원) -->
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-left">
                                <button onclick="copyText('${p.email}', '이메일')" class="p-3 rounded-xl ${infoBoxClass} transition flex items-center gap-3 group" title="클릭하여 이메일 복사">
                                    <div class="w-9 h-9 rounded-lg bg-brand-accent/15 text-brand-accent flex items-center justify-center shrink-0">
                                        <i data-lucide="mail" class="w-4 h-4"></i>
                                    </div>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-[11px] font-mono ${subTextColor}">EMAIL (클릭 복사)</div>
                                        <div class="text-xs sm:text-sm font-semibold truncate">${p.email}</div>
                                    </div>
                                </button>

                                <button onclick="copyText('${p.phone}', '연락처')" class="p-3 rounded-xl ${infoBoxClass} transition flex items-center gap-3 group" title="클릭하여 연락처 복사">
                                    <div class="w-9 h-9 rounded-lg bg-brand-accent/15 text-brand-accent flex items-center justify-center shrink-0">
                                        <i data-lucide="phone" class="w-4 h-4"></i>
                                    </div>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-[11px] font-mono ${subTextColor}">PHONE (클릭 복사)</div>
                                        <div class="text-xs sm:text-sm font-semibold truncate">${p.phone}</div>
                                    </div>
                                </button>

                                <button onclick="copyText('${p.location}', '주소')" class="p-3 rounded-xl ${infoBoxClass} transition flex items-center gap-3 group" title="클릭하여 주소 복사">
                                    <div class="w-9 h-9 rounded-lg bg-brand-accent/15 text-brand-accent flex items-center justify-center shrink-0">
                                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                                    </div>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-[11px] font-mono ${subTextColor}">주소 (클릭 복사)</div>
                                        <div class="text-xs sm:text-sm font-semibold truncate">${p.location}</div>
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            `;
        }

        /* ============================================================================
           에디토리얼 미니멀리스트 (Executive Editorial)
           - 특징: 정돈된 매거진/이력서 스타일의 고대비 타이포그래피와 넘버링 섹션,
                  시니어/리드 엔지니어의 신뢰감을 극대화하는 경력 중심 배치
           ============================================================================ */
        function renderTemplateC() {
            return `
                <div class="template-fade max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-12">
                    <!-- 상단 퀵 앵커 바 -->
                    <nav class="flex flex-wrap items-center justify-between gap-2 border-y-2 border-brand-dark py-3 text-xs font-mono font-bold text-brand-dark">
                        <span>INDEX // ${portfolioData.profile.nameEn.toUpperCase()} PORTFOLIO</span>
                        <div class="flex flex-wrap gap-4">
                            <a href="#section-hero" class="hover:text-brand-accent">01.PROFILE</a>
                            <a href="#section-activities" class="hover:text-brand-accent">02.CAREER</a>
                            <a href="#section-projects" class="hover:text-brand-accent">03.PROJECTS</a>
                            <a href="#section-skills" class="hover:text-brand-accent">04.SKILLS</a>
                            <a href="#section-cert-edu" class="hover:text-brand-accent">05.CREDENTIALS</a>
                            <a href="#section-docs" class="hover:text-brand-accent">06.ARCHIVES</a>
                        </div>
                    </nav>

                    <!-- 01. 메인 화면 (필수 구조: 좌측 프로필 사진, 우측 기본 정보) -->
                    ${renderHeroSection('C')}

                    <!-- 02. 회사 활동 (시니어 포트폴리오 특화: 경력을 상단에 배치) -->
                    <section id="section-activities" class="space-y-6">
                        <div class="flex items-baseline justify-between border-b-2 border-brand-dark pb-2">
                            <h2 class="text-2xl font-extrabold text-brand-dark tracking-tight">
                                <span class="font-mono text-brand-accent mr-2">02.</span>회사 활동 및 경력 (Career & Leadership)
                            </h2>
                            <span class="font-mono text-xs text-brand-main">2015 — PRESENT</span>
                        </div>

                        <div class="divide-y divide-brand-sub bg-white border-2 border-brand-dark rounded-2xl overflow-hidden">
                            ${portfolioData.companyActivities.map(act => `
                                <div class="p-6 sm:p-8 grid grid-cols-1 md:grid-cols-12 gap-4">
                                    <div class="md:col-span-4 space-y-1">
                                        <span class="inline-block px-2.5 py-0.5 rounded bg-brand-sub text-brand-dark font-mono text-xs font-bold">${act.period}</span>
                                        <h3 class="text-lg font-extrabold text-brand-dark pt-1">${act.company}</h3>
                                        <p class="text-xs font-bold text-brand-main">${act.position}</p>
                                    </div>
                                    <div class="md:col-span-8 space-y-3">
                                        <p class="text-sm font-semibold text-brand-dark">${act.description}</p>
                                        <ul class="space-y-1.5 text-xs sm:text-sm text-brand-dark/90">
                                            ${act.activities.map(item => `
                                                <li class="flex items-start gap-2">
                                                    <span class="font-mono text-brand-accent font-bold">→</span>
                                                    <span>${item}</span>
                                                </li>
                                            `).join('')}
                                        </ul>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- 03. 주요 프로젝트 -->
                    <section id="section-projects" class="space-y-6">
                        <div class="flex items-baseline justify-between border-b-2 border-brand-dark pb-2">
                            <h2 class="text-2xl font-extrabold text-brand-dark tracking-tight">
                                <span class="font-mono text-brand-accent mr-2">03.</span>주요 프로젝트 (Selected Works)
                            </h2>
                            <span class="font-mono text-xs text-brand-main">8 KEY PROJECTS</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${portfolioData.projects.map((proj, idx) => `
                                <article class="bg-white border-2 border-brand-dark rounded-2xl p-6 flex flex-col justify-between space-y-5 shadow-[4px_4px_0px_#BDDDFC]">
                                    <div class="space-y-3">
                                        <div class="flex items-center justify-between border-b border-brand-sub pb-2.5">
                                            <span class="font-mono text-xs font-bold text-brand-accent">PROJECT 0${idx + 1} // ${proj.category}</span>
                                            ${proj.period ? `<span class="font-mono text-xs text-brand-main">${proj.period}</span>` : ''}
                                        </div>
                                        <h3 class="text-lg font-extrabold text-brand-dark">${proj.title}</h3>
                                        <p class="text-sm font-semibold text-brand-dark/90 leading-relaxed">${proj.summary}</p>
                                        ${proj.details && proj.details.length > 0 ? `
                                            <ul class="space-y-1 text-xs sm:text-sm text-brand-main font-medium">
                                                ${proj.details.map(d => `
                                                    <li class="flex items-start gap-1.5">
                                                        <span class="font-mono text-brand-accent font-bold">-</span>
                                                        <span>${d}</span>
                                                    </li>
                                                `).join('')}
                                            </ul>
                                        ` : ''}
                                    </div>
                                    <div class="pt-2 border-t border-brand-sub/60">
                                        <div class="flex flex-wrap gap-1.5">
                                            ${proj.techs.map(t => `<span class="px-2.5 py-0.5 rounded border border-brand-main text-brand-dark font-mono text-[11px] font-semibold">${t}</span>`).join('')}
                                        </div>
                                    </div>
                                </article>
                            `).join('')}
                        </div>
                    </section>

                    <!-- 04. 기술 스택 -->
                    <section id="section-skills" class="space-y-6">
                        <div class="flex items-baseline justify-between border-b-2 border-brand-dark pb-2">
                            <h2 class="text-2xl font-extrabold text-brand-dark tracking-tight">
                                <span class="font-mono text-brand-accent mr-2">04.</span>기술 스택 (TechnicalProficiency)
                            </h2>
                            <span class="font-mono text-xs text-brand-main">CATEGORIZED SKILLS</span>
                        </div>

                        <div class="bg-white border-2 border-brand-dark rounded-2xl divide-y divide-brand-sub">
                            ${portfolioData.skills.map(cat => `
                                <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                                    <div class="md:col-span-4">
                                        <h3 class="font-extrabold text-base text-brand-dark flex items-center gap-2">
                                            <i data-lucide="${cat.icon}" class="w-4 h-4 text-brand-accent"></i>
                                            <span>${cat.category}</span>
                                        </h3>
                                    </div>
                                    <div class="md:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        ${cat.items.map(s => `
                                            <div class="p-3 rounded-xl bg-brand-light border border-brand-sub flex items-center justify-between">
                                                <div class="text-xs sm:text-sm font-bold text-brand-dark">${s.name}</div>
                                                <span class="text-sm font-bold text-brand-accent tracking-widest">${s.stars}</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- 05. 자격증 & 학력 -->
                    <section id="section-cert-edu" class="space-y-6">
                        <div class="flex items-baseline justify-between border-b-2 border-brand-dark pb-2">
                            <h2 class="text-2xl font-extrabold text-brand-dark tracking-tight">
                                <span class="font-mono text-brand-accent mr-2">05.</span>자격증 및 학력 (Credentials & Education)
                            </h2>
                            <span class="font-mono text-xs text-brand-main">VERIFIED RECORDS</span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-white border-2 border-brand-dark rounded-2xl p-6 space-y-4">
                                <h3 class="font-mono text-xs font-bold uppercase tracking-wider text-brand-main">Licensed Certifications</h3>
                                <div class="divide-y divide-brand-sub">
                                    ${portfolioData.certifications.map(c => `
                                        <div class="py-3 first:pt-0 last:pb-0 flex items-center justify-between gap-2">
                                            <div class="text-sm font-bold text-brand-dark">${c.name}</div>
                                            <span class="font-mono text-xs font-bold px-2.5 py-1 rounded bg-brand-sub text-brand-dark">${c.date}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-white border-2 border-brand-dark rounded-2xl p-6 space-y-4">
                                <h3 class="font-mono text-xs font-bold uppercase tracking-wider text-brand-main">Academic Background</h3>
                                <div class="divide-y divide-brand-sub">
                                    ${portfolioData.education.map(e => `
                                        <div class="py-3 first:pt-0 last:pb-0 space-y-1">
                                            <div class="text-sm font-bold text-brand-dark">${e.school}</div>
                                            <div class="font-mono text-xs text-brand-main">${e.period} <span class="font-sans font-bold text-brand-accent">${e.degree}</span></div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- 06. 문서 첨부 파일 -->
                    <section id="section-docs" class="space-y-6">
                        <div class="flex items-baseline justify-between border-b-2 border-brand-dark pb-2">
                            <h2 class="text-2xl font-extrabold text-brand-dark tracking-tight">
                                <span class="font-mono text-brand-accent mr-2">06.</span>문서 첨부 파일 (Official Dossier & Resume)
                            </h2>
                            <span class="font-mono text-xs text-brand-main">DIRECT DOWNLOAD</span>
                        </div>

                        <div class="bg-brand-dark text-white rounded-2xl p-6 sm:p-8 divide-y divide-white/15">
                            ${portfolioData.documents.map(doc => `
                                <div class="py-4 first:pt-0 last:pb-0 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div class="flex items-center gap-3">
                                        <span class="px-2 py-0.5 rounded bg-brand-sub text-brand-dark font-mono text-xs font-bold">${doc.format}</span>
                                        <h3 class="font-bold text-base text-white">${doc.title}</h3>
                                        <span class="text-xs font-mono text-brand-sub">${doc.filename}</span>
                                    </div>
                                    <button onclick="openDocModal('${doc.id}')" class="shrink-0 px-4 py-2.5 rounded-xl bg-brand-accent text-white text-xs font-bold flex items-center justify-center gap-2 hover:opacity-90 transition">
                                        <i data-lucide="lock" class="w-4 h-4"></i>
                                        <span>다운로드</span>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                </div>
            `;
        }

        function renderCurrentTemplate() {
            const viewport = document.getElementById('template-viewport');
            viewport.innerHTML = renderTemplateC();
            lucide.createIcons();
        }

        // 초기 실행 (최초 암호 입력 게이트 표시)
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            const pageInput = document.getElementById('page-password-input');
            if (pageInput) pageInput.focus();
            applyEnvProfile();
        });
    </script>

    <!-- 하단 공통 푸터 -->
    <footer id="page-footer" class="hidden bg-brand-dark text-white/80 border-t border-white/10 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-brand-accent"></span>
                <span class="font-semibold text-white"><span data-env-full-name></span> — Developer Portfolio</span>
            </div>
            <div class="flex items-center gap-4 font-mono text-[11px] text-brand-sub">
                <span>#6A89A7</span>
                <span>#BDDDFC</span>
                <span>#888DF2</span>
                <span>#384959</span>
            </div>
        </div>
    </footer>
</body>
</html>
